  description: >-
    REST API for prediction market data across Kalshi and Polymarket: full-text
    search over markets, events, and series; historical orderbook snapshots,
    top-of-book timeseries, trades, and OHLCV bars; whale-trade tracking;
    and cross-venue arbitrage and price-spread detection. Authenticated with an
    X-API-Key header and gated by subscription tier.
