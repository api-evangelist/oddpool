name: Oddpool
description: >-
  Oddpool is an institutional-grade data platform for prediction markets,
  offering unified access to market data across Kalshi and Polymarket through a
  single REST API and WebSocket feed. It describes itself as "the search engine
  for prediction markets," normalizing hundreds of thousands of markets into a
  common model so quant funds, trading desks, and prosumer traders can search
  markets and events, pull tick-level historical orderbooks and OHLCV bars,
  track whale trades, detect cross-venue arbitrage, and stream real-time
  cross-venue probability distributions, orderbooks, and trades. Data is
  addressed by what (event and outcome keys) rather than by venue-specific
  tickers. A separate enterprise Reference Data API provides canonical
  cross-venue identifiers, fungibility classification, and a Wikidata cross-walk
  for institutional clients.
