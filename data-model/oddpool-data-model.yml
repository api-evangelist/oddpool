  kind: has_many
  via: event_key
- from: market
  to: outcome
  kind: belongs_to
  via: outcome
- from: market
  to: venue
  kind: belongs_to
  via: venue
- from: market
  to: orderbook_snapshot
  kind: has_many
  via: market_id
- from: market
  to: ohlcv_bar
  kind: has_many
  via: market_ids
- from: market
  to: trade
  kind: has_many
  via: market_id
- from: event
